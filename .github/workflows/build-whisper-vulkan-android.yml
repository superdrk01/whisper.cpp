name: Build whisper.cpp Vulkan for Android

on:
  workflow_dispatch:
    inputs:
      whisper_ref:
        description: "whisper.cpp git ref (branch, tag, or commit SHA)"
        required: true
        default: "master"
      android_api:
        description: "Minimum Android API level"
        required: true
        default: "26"
  push:
    paths:
      - ".github/workflows/build-whisper-vulkan-android.yml"
      - "android/**"
      - "scripts/**"

permissions:
  contents: read

env:
  NDK_VERSION: "28.1.13356709"
  CMAKE_VERSION: "3.31.1"
  VULKAN_HEADERS_REF: "v1.3.296"
  SPIRV_HEADERS_REF: "vulkan-sdk-1.3.296.0"
  WHISPER_REF: ${{ github.event.inputs.whisper_ref || 'master' }}
  ANDROID_API: 29

jobs:
  build:
    name: Build ${{ matrix.abi }}
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        # Vulkan is intentionally limited to 64-bit Android targets.
        abi:
          - arm64-v8a
          - x86_64

    steps:
      - name: Checkout application repository
        uses: actions/checkout@v4

      - name: Checkout whisper.cpp
        uses: actions/checkout@v4
        with:
          repository: ggml-org/whisper.cpp
          ref: ${{ env.WHISPER_REF }}
          path: whisper.cpp
          fetch-depth: 1

      - name: Checkout Vulkan-Headers
        uses: actions/checkout@v4
        with:
          repository: KhronosGroup/Vulkan-Headers
          ref: ${{ env.VULKAN_HEADERS_REF }}
          path: Vulkan-Headers
          fetch-depth: 1

      - name: Checkout SPIRV-Headers
        uses: actions/checkout@v4
        with:
          repository: KhronosGroup/SPIRV-Headers
          ref: ${{ env.SPIRV_HEADERS_REF }}
          path: SPIRV-Headers
          fetch-depth: 1

      - name: Validate checked-out APIs and headers
        shell: bash
        run: |
          set -euxo pipefail

          test -f "$GITHUB_WORKSPACE/Vulkan-Headers/include/vulkan/vulkan.h"
          test -f "$GITHUB_WORKSPACE/Vulkan-Headers/include/vulkan/vulkan.hpp"
          test -f "$GITHUB_WORKSPACE/SPIRV-Headers/include/spirv/unified1/spirv.h"
          test -f "$GITHUB_WORKSPACE/SPIRV-Headers/include/spirv/unified1/spirv.hpp"

          # The JNI wrapper requires these newer whisper.cpp APIs.
          grep -q "whisper_full_get_token_t0" \
            "$GITHUB_WORKSPACE/whisper.cpp/include/whisper.h"
          grep -q "whisper_full_get_token_t1" \
            "$GITHUB_WORKSPACE/whisper.cpp/include/whisper.h"
          grep -q "whisper_full_n_vad_segments" \
            "$GITHUB_WORKSPACE/whisper.cpp/include/whisper.h"
          grep -q "whisper_full_get_vad_segment_t0" \
            "$GITHUB_WORKSPACE/whisper.cpp/include/whisper.h"
          grep -q "whisper_full_get_vad_segment_t1" \
            "$GITHUB_WORKSPACE/whisper.cpp/include/whisper.h"

          # Catch the common CMake typo that produces an android/BEFORE include path.
          if grep -R -nE 'include_directories\([[:space:]]*SYSTEM[[:space:]]+BEFORE' android; then
            echo "ERROR: use include_directories(BEFORE SYSTEM ...), not SYSTEM BEFORE." >&2
            exit 1
          fi

      - name: Install host shader toolchain
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            glslc \
            ninja-build \
            libvulkan-dev \
            zip \
            unzip
          glslc --version

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK and CMake
        shell: bash
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "ndk;${NDK_VERSION}" \
            "cmake;${CMAKE_VERSION}"

          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_CMAKE=${ANDROID_SDK_ROOT}/cmake/${CMAKE_VERSION}/bin/cmake" >> "$GITHUB_ENV"

      - name: Install SPIRV-Headers CMake package
        shell: bash
        run: |
          set -euxo pipefail

          SPIRV_PREFIX="$GITHUB_WORKSPACE/deps/spirv-headers"
          rm -rf "$GITHUB_WORKSPACE/build/spirv-headers-host" "$SPIRV_PREFIX"

          "$ANDROID_CMAKE" \
            -S "$GITHUB_WORKSPACE/SPIRV-Headers" \
            -B "$GITHUB_WORKSPACE/build/spirv-headers-host" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$SPIRV_PREFIX" \
            -DSPIRV_HEADERS_ENABLE_INSTALL=ON \
            -DSPIRV_HEADERS_ENABLE_TESTS=OFF

          "$ANDROID_CMAKE" \
            --build "$GITHUB_WORKSPACE/build/spirv-headers-host" \
            --target install \
            --parallel "$(nproc)"

          test -f "$SPIRV_PREFIX/share/cmake/SPIRV-Headers/SPIRV-HeadersConfig.cmake"
          echo "SPIRV_HEADERS_PREFIX=$SPIRV_PREFIX" >> "$GITHUB_ENV"

      - name: Configure Android build
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf "build/${{ matrix.abi }}"

          "$ANDROID_CMAKE" \
            -S android \
            -B "build/${{ matrix.abi }}" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI="${{ matrix.abi }}" \
            -DANDROID_PLATFORM="android-${ANDROID_API}" \
            -DANDROID_STL=c++_shared \
            -DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON \
            -DCMAKE_SHARED_LINKER_FLAGS="-Wl,-z,max-page-size=16384 -Wl,-z,common-page-size=16384" \
            -DWHISPER_CPP_DIR="$GITHUB_WORKSPACE/whisper.cpp" \
            -DVULKAN_HEADERS_DIR="$GITHUB_WORKSPACE/Vulkan-Headers/include" \
            -DVulkan_INCLUDE_DIR="$GITHUB_WORKSPACE/Vulkan-Headers/include" \
            -DSPIRV_HEADERS_DIR="$SPIRV_HEADERS_PREFIX/include" \
            -DSPIRV-Headers_DIR="$SPIRV_HEADERS_PREFIX/share/cmake/SPIRV-Headers" \
            -DCMAKE_PREFIX_PATH="$SPIRV_HEADERS_PREFIX" \
            -DGGML_VULKAN=ON \
            -DGGML_CPU=ON \
            -DGGML_NATIVE=OFF \
            -DGGML_OPENMP=OFF \
            -DGGML_CCACHE=OFF \
            -DGGML_BUILD_TESTS=OFF \
            -DWHISPER_BUILD_TESTS=OFF \
            -DWHISPER_BUILD_EXAMPLES=OFF \
            -DVulkan_GLSLC_EXECUTABLE="$(command -v glslc)" \
            -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=BOTH

      - name: Build library and Vulkan shaders
        shell: bash
        run: |
          set -euxo pipefail
          "$ANDROID_CMAKE" \
            --build "build/${{ matrix.abi }}" \
            --target whisper_android \
            --parallel "$(nproc)"

      - name: Stage ABI package
        shell: bash
        run: |
          set -euxo pipefail

          ABI="${{ matrix.abi }}"
          STAGE="dist/$ABI"
          mkdir -p "$STAGE/lib" "$STAGE/include" "$STAGE/java/com/example/whisper"

          LIB="$(find "build/$ABI" -type f -name 'libwhisper_android.so' -print -quit)"
          test -n "$LIB"
          cp "$LIB" "$STAGE/lib/"

          case "$ABI" in
            arm64-v8a) TRIPLE="aarch64-linux-android" ;;
            x86_64)    TRIPLE="x86_64-linux-android" ;;
            *) echo "Unsupported ABI: $ABI" >&2; exit 2 ;;
          esac

          PREBUILT="$(find "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt" \
            -mindepth 1 -maxdepth 1 -type d -print -quit)"
          test -n "$PREBUILT"

          CXX_SHARED="$PREBUILT/sysroot/usr/lib/$TRIPLE/libc++_shared.so"
          test -f "$CXX_SHARED"
          cp "$CXX_SHARED" "$STAGE/lib/"

          # Verify that every shipped shared library supports 16 KB ELF pages.
          READELF="$PREBUILT/bin/llvm-readelf" \
            bash scripts/verify-16kb-elf.sh \
            "$STAGE/lib/libwhisper_android.so" \
            "$STAGE/lib/libc++_shared.so"

          cp android/include/whisper_android.h "$STAGE/include/"
          cp whisper.cpp/include/whisper.h "$STAGE/include/"
          cp whisper.cpp/ggml/include/ggml.h "$STAGE/include/"
          cp android/java/com/example/whisper/WhisperEngine.java \
            "$STAGE/java/com/example/whisper/"
          cp android/consumer-rules.pro "$STAGE/"

          cat > "$STAGE/build-info.txt" <<EOF
          whisper_ref=${WHISPER_REF}
          whisper_commit=$(git -C whisper.cpp rev-parse HEAD)
          android_abi=${ABI}
          android_api=${ANDROID_API}
          ndk_version=${NDK_VERSION}
          cmake_version=${CMAKE_VERSION}
          build_type=Release
          vulkan=enabled
          cpu_fallback=enabled
          page_size_compatible=16384
          vulkan_headers_ref=${VULKAN_HEADERS_REF}
          spirv_headers_ref=${SPIRV_HEADERS_REF}
          EOF

          mkdir -p dist
          (
            cd dist
            zip -qr "whisper-vulkan-android-${ABI}.zip" "$ABI"
          )

      - name: Upload ABI artifact
        uses: actions/upload-artifact@v4
        with:
          name: whisper-vulkan-android-${{ matrix.abi }}
          path: dist/whisper-vulkan-android-${{ matrix.abi }}.zip
          if-no-files-found: error
          retention-days: 14

  bundle:
    name: Create combined package
    runs-on: ubuntu-24.04
    needs: build

    steps:
      - name: Download ABI artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: whisper-vulkan-android-*
          path: artifacts
          merge-multiple: true

      - name: Create combined archive
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p combined
          for zipfile in artifacts/*.zip; do
            unzip -q "$zipfile" -d combined
          done
          (
            cd combined
            zip -qr ../whisper-vulkan-android-all-abis.zip .
          )

      - name: Upload combined artifact
        uses: actions/upload-artifact@v4
        with:
          name: whisper-vulkan-android-all-abis
          path: whisper-vulkan-android-all-abis.zip
          if-no-files-found: error
          retention-days: 14
